{% extends 'layout.html' %}
{% block content %}

<h2>My Leave History</h2>

<table class="table table-bordered">
<tr>
<th>Leave Type</th>
<th>Start Date</th>
<th>End Date</th>
<th>Status</th>
</tr>

{% for l in leaves %}
<tr>
<td>{{ l[2] }}</td>   <!-- leave_type -->
<td>{{ l[3] }}</td>   <!-- start_date -->
<td>{{ l[4] }}</td>   <!-- end_date -->

<td>
{% if l[6] == 'Pending' %}
    <span style="color:orange;">Pending</span>
{% elif l[6] == 'Approved' %}
    <span style="color:green;">Approved</span>
{% else %}
    <span style="color:red;">Rejected</span>
{% endif %}
</td>

</tr>
{% endfor %}

</table>

{% endblock %}
